<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle System - Настройка персонажа</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="app">
        <!-- Экран настройки персонажа (Этап 1: имитация данных аккаунта из БД).
             Раньше здесь был выбор одного из 4 заготовленных бойцов; теперь
             карточка составляется вручную и отправляется в php/join.php.
             В будущем поля uid/nickname будет подставлять аккаунт игрока. -->
        <div id="login-screen">
            <h1>⚔️ BATTLE SYSTEM TEST ⚔️</h1>
            <p class="setup-subtitle">Настройка персонажа перед боем</p>

            <form id="character-form" autocomplete="off">
                <!-- Имитация данных аккаунта (БД/меню аккаунта пока не связано с движком) -->
                <fieldset class="setup-group">
                    <legend>Аккаунт</legend>
                    <label class="setup-field">
                        <span>UID игрока</span>
                        <input type="text" id="fld-uid" inputmode="numeric" pattern="[0-9]+"
                               maxlength="2" placeholder="1..4 (слот спавна)" required>
                    </label>
                    <label class="setup-field">
                        <span>Никнейм</span>
                        <input type="text" id="fld-nickname" maxlength="24"
                               placeholder="Ник из БД" required>
                    </label>
                </fieldset>

                <!-- Характеристики: числовые поля ввода -->
                <fieldset class="setup-group">
                    <legend>Характеристики</legend>
                    <div class="stat-grid">
                        <label class="setup-field">
                            <span>Здоровье <small>1-10</small></span>
                            <input type="number" id="stat-HITPOINTS" min="1" max="10" step="1" value="10" required>
                        </label>
                        <label class="setup-field">
                            <span>Щит <small>1-10</small></span>
                            <input type="number" id="stat-SHIELD" min="1" max="10" step="1" value="5" required>
                        </label>
                        <label class="setup-field">
                            <span>Сопротивление <small>1-9</small></span>
                            <input type="number" id="stat-RESISTANCE" min="1" max="9" step="1" value="3" required>
                        </label>
                        <label class="setup-field">
                            <span>Атака <small>1-10</small></span>
                            <input type="number" id="stat-ATTACK" min="1" max="10" step="1" value="5" required>
                        </label>
                        <label class="setup-field">
                            <span>Дальность <small>1-10</small></span>
                            <input type="number" id="stat-RANGE" min="1" max="10" step="1" value="5" required>
                        </label>
                        <label class="setup-field">
                            <span>Очки действий <small>1-3</small></span>
                            <input type="number" id="stat-ACTIONS" min="1" max="3" step="1" value="2" required>
                        </label>
                    </div>
                </fieldset>

                <!-- Способности: ровно 3 из реестра игры (список подгружается из init.php) -->
                <fieldset class="setup-group">
                    <legend>Способности <small>(ровно 3)</small> — <span id="ability-count">0/3</span></legend>
                    <select id="sel-abilities" multiple size="6" aria-label="Список способностей"></select>
                    <p class="setup-hint">Удерживайте Ctrl (Cmd на macOS) для выбора нескольких.</p>
                </fieldset>

                <!-- Пассивные способности: от 0 до 5 чекбоксов -->
                <fieldset class="setup-group">
                    <legend>Пассивные способности <small>(0-5)</small> — <span id="passive-count">0/5</span></legend>
                    <div id="passives-list"></div>
                </fieldset>

                <button type="submit" id="btn-join" class="player-btn join-btn">🎮 Подключиться к бою</button>
            </form>

            <div id="init-status"></div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" style="display:none;">
            <!-- Верхняя панель -->
            <div id="top-bar">
                <div id="player-info">
                    <span id="current-player-name"></span>
                    <span id="current-player-hp"></span>
                    <span id="current-player-shield"></span>
                    <span id="current-player-actions"></span>
                </div>
                <div id="turn-timer">
                    <span>Ход через: <span id="timer-value">10</span>с</span>
                </div>
                <div id="negatives-display"></div>
            </div>

            <!-- Игровое поле -->
            <div id="game-field">
                <div id="grid-container">
                    <!-- Сетка будет сгенерирована JS -->
                </div>
            </div>

            <!-- Диалог действий при клике -->
            <div id="action-dialog" style="display:none;">
                <div id="dialog-title">Координаты: <span id="dialog-coords"></span></div>
                <div id="dialog-actions">
                    <button id="btn-move" class="action-btn move-btn">🚶 Двигаться</button>
                    <button id="btn-attack" class="action-btn attack-btn">⚔️ Атака</button>
                    <button id="btn-ability1" class="action-btn ability-btn">🔥 Способность 1</button>
                    <button id="btn-ability2" class="action-btn ability-btn">❄️ Способность 2</button>
                    <button id="btn-ability3" class="action-btn ability-btn">💀 Способность 3</button>
                </div>
                <button id="btn-close-dialog" class="close-btn">✕ Закрыть</button>
            </div>

            <!-- Лог событий -->
            <div id="log-panel">
                <h3>Лог боя</h3>
                <div id="log-content"></div>
            </div>

            <!-- Панель способностей -->
            <div id="abilities-panel">
                <h3>Способности</h3>
                <div id="abilities-list"></div>
            </div>
        </div>
    </div>

    <!-- Клиент разбит на модули (см. AGENTS.md §5). Порядок важен:
         объявления функций hoist'ятся, но CONFIG/state должны быть первыми,
         точка входа main.js — последней. Сборщики/npm не используются (табу стека). -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/path.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/render.js"></script>
    <script src="js/input.js"></script>
    <script src="js/net.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
